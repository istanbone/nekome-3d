<title>猫目 二十周年</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="猫目 二十周年おめでとうございます。お店の中を3Dで歩いて見られます。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@600;800&family=Zen+Old+Mincho:wght@600&family=Zen+Maru+Gothic:wght@500;700&display=swap">
<style>
/* Layout: the bar fills the screen. Top right, the shop's own 猫目 lettering and the greeting run vertically like a shop sign.
   Bottom: the tour's stops as a trail of paw prints and a dock of cat-head buttons (the big one is the shop's tin cat: odd eyes, rivets, a bell).
   One deliberate night look: lamp amber, sign red, black walls. */
:root {
  --night: #0c0a08;
  --ink: #f4ead8;
  --muted: #bcab91;
  --lamp: #f0b257;
  --lamp-deep: #b97a2b;
  --red: #e0453a;
  --ink-red: #b01218;
  --jade: #3fbf62;
  --paper: #f3ead6;
  --wood: #2b1b12;
  --wood-hi: #3d281b;
  --glass: rgba(16, 11, 8, 0.7);
  --gold: #e4cd98;
  --tin: #cdb07a;
  --shu: #e34b2c;
  --midori: #3fbf62;
  --font-wa: "Zen Old Mincho", "Hiragino Mincho ProN", "Yu Mincho", "Noto Serif CJK JP", "Noto Serif JP", serif;
  --font-title: "Shippori Mincho B1", "Hiragino Mincho ProN", "Yu Mincho", serif;
  --font-ui: "Zen Maru Gothic", "Hiragino Maru Gothic ProN", "Hiragino Sans", "Yu Gothic", system-ui, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--night); color: var(--ink); font-family: var(--font-ui); overflow: hidden; -webkit-tap-highlight-color: transparent; }
.app { height: 100%; }
.stage { position: relative; height: 100%; background: var(--night); overflow: hidden; touch-action: none; }
canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: grab; }
canvas:active { cursor: grabbing; }

/* greeting: vertical, top right, like the sign on the door */
.hero {
  position: absolute; top: 0; right: 0; pointer-events: none;
  display: flex; flex-direction: row-reverse; align-items: flex-start; gap: 10px;
  padding-top: calc(18px + env(safe-area-inset-top, 0px));
  padding-right: max(18px, env(safe-area-inset-right, 0px)); padding-left: 60px; padding-bottom: 60px;
  background: radial-gradient(ellipse at 100% 0%, rgba(12, 10, 8, 0.85) 0%, rgba(12, 10, 8, 0.55) 45%, rgba(12, 10, 8, 0) 72%);
}

.greet {
  margin: 6px 0 0; writing-mode: vertical-rl; text-orientation: upright; font-family: var(--font-wa); font-weight: 600;
  font-size: clamp(19px, 5vw, 26px); line-height: 1.4; letter-spacing: .5em; color: var(--gold);
  text-shadow: 0 1px 8px rgba(0, 0, 0, .85);
}
.greet .g1 { display: block; }
.greet .g2 { display: block; font-size: .7em; letter-spacing: .32em; color: var(--ink); margin-block-start: .35em; padding-inline-start: 1.6em; }
.greet .tcy { text-combine-upright: all; -webkit-text-combine: horizontal; color: var(--lamp); }

/* shop card button, top left */
.shopbtn {
  position: absolute; top: calc(16px + env(safe-area-inset-top, 0px)); left: max(16px, env(safe-area-inset-left, 0px));
  display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 0; border: 0; background: none; cursor: pointer;
  font: inherit; color: var(--ink); touch-action: manipulation;
}

.say { position: absolute; bottom: 54px; white-space: nowrap; pointer-events: none;
  background: var(--paper); color: #1a1410; font-size: 12px; font-weight: 700; padding: 3px 10px; border-radius: 10px; opacity: 0; transition: opacity .25s; }
.say.on { opacity: 1; }
.walker:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; border-radius: 8px; }
@media (prefers-reduced-motion: no-preference) {
  .walker { animation: stroll 26s linear infinite; }
  .walker .wb, .walker .wh { animation: bob .5s ease-in-out infinite; }
  .walker .leg { transform-box: fill-box; transform-origin: 50% 0; animation: step .5s ease-in-out infinite alternate; }
  .walker .leg.b { animation-delay: -.5s; }
  .walker .tail { transform-box: fill-box; transform-origin: 100% 100%; animation: wag 1.4s ease-in-out infinite alternate; }
  .walker.paused, .walker.paused .wb, .walker.paused .wh, .walker.paused .leg, .walker.paused .tail { animation-play-state: paused; }
  .walker.hop .wb, .walker.hop .wh { animation: hop .45s ease-out; }
}
@keyframes stroll {
  0% { transform: translateX(0) scaleX(1); }
  49.99% { transform: translateX(calc(100cqw - 74px)) scaleX(1); }
  50% { transform: translateX(calc(100cqw - 74px)) scaleX(-1); }
  100% { transform: translateX(0) scaleX(-1); }
}
@keyframes bob { 0%, 100% { translate: 0 0; } 50% { translate: 0 -1.5px; } }
@keyframes step { from { transform: rotate(18deg); } to { transform: rotate(-18deg); } }
@keyframes wag { from { transform: rotate(-12deg); } to { transform: rotate(16deg); } }
@keyframes hop { 0%, 100% { translate: 0 0; } 40% { translate: 0 -14px; } }

/* bottom: caption, paw trail, dock */
.bottom {
  position: absolute; inset: auto 0 0; display: flex; flex-direction: column; align-items: center; gap: 8px;
  padding-bottom: calc(12px + env(safe-area-inset-bottom, 0px)); padding-top: 70px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: linear-gradient(to top, rgba(12, 10, 8, 0.88), rgba(12, 10, 8, 0.5) 55%, rgba(12, 10, 8, 0));
  pointer-events: none;
}
.bottom > * { pointer-events: auto; }
.caption {
  margin: 0; display: flex; align-items: baseline; gap: 8px; min-height: 22px; font-size: 14px; font-weight: 700; letter-spacing: .04em;
  color: var(--ink); text-shadow: 0 1px 6px rgba(0, 0, 0, .8);
}
.caption .step { font-size: 12px; color: var(--lamp); font-variant-numeric: tabular-nums; }
.paws { list-style: none; display: flex; gap: 2px; margin: 0; padding: 0; }
.paw {
  width: 34px; height: 38px; padding: 0; border: 0; background: none; cursor: pointer; color: var(--muted); opacity: .45;
  display: grid; place-items: center; touch-action: manipulation; transition: opacity .25s, color .25s;
}
.paws li:nth-child(odd) .paw svg { transform: translateY(5px) rotate(-14deg); }
.paws li:nth-child(even) .paw svg { transform: translateY(-3px) rotate(10deg); }
.paw svg { width: 21px; height: 21px; display: block; fill: currentColor; }
.paw:hover { opacity: .8; }
.paw.on { color: var(--red); opacity: 1; }
.paw.on svg { filter: drop-shadow(0 0 6px rgba(224, 69, 58, .7)); }
.paw:focus-visible { outline: 2px solid var(--lamp); outline-offset: 2px; border-radius: 6px; }

.dock { display: flex; align-items: flex-end; justify-content: center; gap: clamp(10px, 4vw, 22px); }
.cat {
  position: relative; display: flex; flex-direction: column; align-items: center; gap: 4px;
  padding: 0; border: 0; background: none; color: var(--ink); cursor: pointer; font: inherit; touch-action: manipulation;
}
.cat .head { position: relative; width: 48px; height: 43px; display: block; transition: transform .2s; }
.cat.lg .head { width: 66px; height: 59px; }
.cat .head > svg.shape, .cat .head > svg.eyes { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.cat .shape .fill { fill: rgba(12, 10, 8, .4); stroke: var(--tin); stroke-width: 1.5; vector-effect: non-scaling-stroke; }
.cat .ico { position: absolute; left: 50%; top: 59%; width: 18px; height: 18px; transform: translate(-50%, -50%); fill: none; stroke: var(--ink); stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.cat .lbl { font-size: 12px; font-weight: 700; letter-spacing: .04em; color: var(--ink); text-shadow: 0 1px 4px rgba(0, 0, 0, .9); white-space: nowrap; }
.cat.lg .lbl { font-size: 12px; color: var(--ink); }
.cat:hover .head { transform: translateY(-2px); }
.cat:active .head { transform: translateY(1px) scale(.97); }
.cat:focus-visible { outline: none; }
.cat:focus-visible .shape .fill { stroke: var(--gold); stroke-width: 2.5; }
/* the big one is the tin cat on the wall: pewter, rivets, odd eyes, a bell */
.cat.lg .shape .fill { fill: rgba(12, 10, 8, .55); }
.cat.lg[aria-pressed="true"] .shape .fill { stroke: #ead29b; }
.cat.lg .shape .rivets { fill: none; stroke: var(--tin); stroke-width: 1.7; stroke-linecap: round; stroke-dasharray: 0 5; opacity: .6; }
.cat.lg .eyes { position: absolute; inset: 0; width: 100%; height: 100%; }
.eyes .open { display: none; }
.cat[aria-pressed="true"] .eyes .open { display: inline; }
.cat[aria-pressed="true"] .eyes .shut { display: none; }
.eyes .me-l { fill: var(--midori); }
.eyes .me-r { fill: var(--shu); }
.eyes .gem-r { fill: var(--red); }
.eyes .glint { fill: #fff; opacity: .85; }
.eyes .shut path { fill: none; stroke: var(--tin); stroke-width: 1.6; stroke-linecap: round; }
.eyes .whisk { stroke: #4a4238; stroke-width: 1.3; stroke-linecap: round; }
.eyes .nose { fill: #4a4238; }
.bell { position: absolute; left: 50%; bottom: -10px; width: 18px; height: 18px; transform: translateX(-50%); transform-origin: 50% -4px; }
.bell circle { fill: var(--lamp); stroke: var(--lamp-deep); stroke-width: 1.2; }
.bell path { stroke: var(--lamp-deep); stroke-width: 1.2; fill: none; }
@media (prefers-reduced-motion: no-preference) {
  .cat[aria-pressed="true"] .eyes .open { animation: blink 5.5s infinite; transform-origin: 50% 50%; transform-box: fill-box; }
  .cat.lg[aria-pressed="false"] .head { animation: doze 3.2s ease-in-out infinite; }
  .cat.lg.ring .bell { animation: ring .7s ease-out; }
}
@keyframes blink { 0%, 93%, 100% { transform: scaleY(1); } 96% { transform: scaleY(.1); } }
@keyframes doze { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
@keyframes ring { 0% { transform: translateX(-50%) rotate(0); } 20% { transform: translateX(-50%) rotate(24deg); } 45% { transform: translateX(-50%) rotate(-18deg); } 70% { transform: translateX(-50%) rotate(9deg); } 100% { transform: translateX(-50%) rotate(0); } }

.hint, .toast {
  position: absolute; left: 50%; transform: translateX(-50%); max-width: calc(100% - 32px); text-align: center;
  background: var(--glass); border: 1px solid rgba(240, 178, 87, .35); color: var(--ink); border-radius: 999px;
  padding: 8px 16px; font-size: 13px; font-weight: 500; line-height: 1.5; pointer-events: none; transition: opacity .5s;
}
.hint { top: 50%; }
.toast { top: 42%; }
.hint.fade { opacity: 0; }

/* shop card */
.sheet { position: absolute; inset: 0; z-index: 6; display: grid; place-items: center; background: rgba(8, 6, 5, .72);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.card {
  position: relative; width: min(460px, 100%); background: var(--paper); color: #3a2a20; border-radius: 6px;
  padding: 26px 22px 20px; box-shadow: 0 18px 50px rgba(0,0,0,.6); transform: rotate(-1.2deg);
}
.card img.sign { width: 100%; height: auto; display: block; filter: brightness(0); opacity: .88; }
.card .row { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 8px 12px; margin-top: 16px; font-size: 14px; }
.card .tel { font-family: var(--font-title); font-size: 20px; font-weight: 800; color: #1a1410; letter-spacing: .06em; user-select: all; font-variant-numeric: tabular-nums; }
.card .small { font-size: 13px; color: #1a1410; font-family: var(--font-wa); text-align: center; margin: 12px 0 0; line-height: 1.7; }
.pill { font: inherit; font-size: 13px; font-weight: 700; padding: 6px 14px; border-radius: 999px; border: 1.5px solid #1a1410; color: #1a1410; background: transparent; cursor: pointer; text-decoration: none; }
.pill:focus-visible { outline: 2px solid #1a1410; outline-offset: 2px; }
.card .close { position: absolute; top: 6px; right: 8px; width: 36px; height: 36px; border: 0; background: none; font-size: 22px; color: #6b5a4b; cursor: pointer; border-radius: 50%; }
.card .close:focus-visible { outline: 2px solid #1a1410; }

/* opening: the tin cat keeps watch while the bar loads */
.loader {
  position: absolute; inset: 0; display: grid; place-content: center; justify-items: center; gap: 14px; text-align: center;
  background: #fff; z-index: 7; transition: opacity .9s ease;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.loader.done { opacity: 0; pointer-events: none; }

<script>
"use strict";
const SH_C0 = 0.28209479177387814;
const FOV = 60 * Math.PI / 180;

/* ---------- sorting (shared by worker and fallback) ---------- */
function sortSplats(pos, n, v) {
  const sizeList = new Int32Array(n);
  let maxD = -Infinity, minD = Infinity;
  const a = v[2], b = v[6], c = v[10];
  for (let i = 0; i < n; i++) {
    const d = ((a * pos[3 * i] + b * pos[3 * i + 1] + c * pos[3 * i + 2]) * 4096) | 0;
    sizeList[i] = d;
    if (d > maxD) maxD = d;
    if (d < minD) minD = d;
  }
  const inv = 65535 / ((maxD - minD) || 1);
  const counts = new Uint32Array(65536);
  for (let i = 0; i < n; i++) { const k = ((sizeList[i] - minD) * inv) | 0; sizeList[i] = k; counts[k]++; }
  const starts = new Uint32Array(65536);
  for (let i = 1; i < 65536; i++) starts[i] = starts[i - 1] + counts[i - 1];
  const out = new Uint32Array(n);
  for (let i = 0; i < n; i++) out[starts[sizeList[i]]++] = i;
  return out;
}
function workerMain() {
  let pos = null, n = 0, id = 0, last = null;
  self.onmessage = (e) => {
    const m = e.data;
    if (m.pos) { pos = m.pos; n = pos.length / 3; id = m.id; last = null; }
    if (m.view && pos) {
      const v = m.view;
      if (last && Math.abs(last[0] - v[2]) < 0.002 && Math.abs(last[1] - v[6]) < 0.002 && Math.abs(last[2] - v[10]) < 0.002) return;
      last = [v[2], v[6], v[10]];
      const idx = sortSplats(pos, n, v);
      self.postMessage({ index: idx, id }, [idx.buffer]);
    }
  };
}

/* ---------- half float ---------- */
const _f = new Float32Array(1), _i = new Int32Array(_f.buffer);
function floatToHalf(x) {
  _f[0] = x; const f = _i[0];
  const sign = (f >> 31) & 1, exp = (f >> 23) & 0xff;
  let frac = f & 0x7fffff, e;
  if (exp === 0) e = 0;
  else if (exp < 113) { e = 0; frac |= 0x800000; frac = frac >> (113 - exp); if (frac & 0x1000000) { e = 1; frac = 0; } }
  else if (exp < 142) e = exp - 112;
  else { e = 31; frac = 0; }
  return (sign << 15) | (e << 10) | (frac >> 13);
}
function packHalf2x16(x, y) { return (floatToHalf(x) | (floatToHalf(y) << 16)) >>> 0; }
function halfToFloat(h) {
  const s = (h & 0x8000) ? -1 : 1, e = (h >> 10) & 0x1f, m = h & 0x3ff;
  if (e === 0) return s * Math.pow(2, -14) * (m / 1024);
  if (e === 31) return m ? NaN : s * Infinity;
  return s * Math.pow(2, e - 15) * (1 + m / 1024);
}

/* ---------- common splat data ---------- */
function makeData(n) {
  return { n, pos: new Float32Array(3 * n), scl: new Float32Array(3 * n), rot: new Float32Array(4 * n), rgba: new Uint8ClampedArray(4 * n), rub: false };
}

/* ---------- parsers ---------- */
async function parseSPZ(buf) {
  let bytes = new Uint8Array(buf);
  if (bytes[0] === 0x1f && bytes[1] === 0x8b) {
    if (typeof DecompressionStream === "undefined") throw new Error("このブラウザはSPZの展開に対応していません。最新のChrome・Edge・Safari・Firefoxで開いてください。");
    const stream = new Blob([buf]).stream().pipeThrough(new DecompressionStream("gzip"));
    bytes = new Uint8Array(await new Response(stream).arrayBuffer());
  }
  const dv = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength);
  if (dv.getUint32(0, true) !== 0x5053474e) throw new Error("SPZファイルとして読み込めませんでした。ファイルが壊れていないか確認してください。");
  const version = dv.getUint32(4, true), n = dv.getUint32(8, true), frac = bytes[13];

  o += n;

    d.rgba[4 * i + k] = (0.5 + SH_C0 * dc) * 255;
  }
  o += 3 * n;
  for (let i = 0; i < 3 * n; i++) d.scl[i] = Math.exp(bytes[o + i] / 16 - 10);
  o += 3 * n;

    const mask = 511, r = Math.SQRT1_2, q = [0, 0, 0, 0];
    for (let i = 0; i < n; i++) {

    }

    for (let i = 0; i < n; i++) {

      d.rot[4 * i] = Math.sqrt(Math.max(0, 1 - x * x - y * y - z * z));
      d.rot[4 * i + 1] = x; d.rot[4 * i + 2] = y; d.rot[4 * i + 3] = z;
    }
  }
  return d;
}

const PLY_TYPES = { char: 1, int8: 1, uchar: 1, uint8: 1, short: 2, int16: 2, ushort: 2, uint16: 2, int: 4, int32: 4, uint: 4, uint32: 4, float: 4, float32: 4, double: 8, float64: 8 };

let lastSortKey = "";

const pointers = new Map();

function rotateBy(dx, dy) {

function zoomBy(factor) {

/* ---------- camera tour (room frame: x right, y up, metres) ---------- */
const TOUR_KEYS = [
  { eye: [-1.30, -0.30, -1.75], look: [-0.55, -0.65, 4.50], dur: 8 },  // 入口からカウンターを奥まで
  { eye: [-1.35, -0.38, 0.20], look: [1.20, -0.45, 1.60], dur: 6 },    // 進みながらバック棚へ
  { eye: [-1.25, -0.45, 1.40], look: [1.20, -0.30, 1.40], dur: 7 },    // カウンター席からの眺め
  { eye: [-1.25, -0.45, 2.90], look: [1.20, -0.35, 3.30], dur: 6 },    // 棚に沿って横移動
  { eye: [-1.40, -0.35, 3.90], look: [-0.40, 0.45, 1.20], dur: 5 },    // 天井のランプを見上げる
  { eye: [-1.20, -0.30, 4.45], look: [-0.60, -0.75, -2.00], dur: 8 },  // 奥から入口側を振り返る
  { eye: [-1.25, -0.30, 1.00], look: [-0.60, -0.70, -2.20], dur: 8 },  // 入口へ戻る
];
const tour = { playing: false, time: 0, blend: 1, from: null };
const tourKeysView = (() => {
  const n = TOUR_KEYS.length;
  const eyes = TOUR_KEYS.map(k => [k.eye[0], -k.eye[1], -k.eye[2]]);
  const ang = TOUR_KEYS.map(k => {
    const f = norm([k.look[0] - k.eye[0], -(k.look[1] - k.eye[1]), -(k.look[2] - k.eye[2])]);
    return [Math.atan2(-f[0], f[2]), Math.asin(Math.max(-1, Math.min(1, f[1])))];
  });
  const wrap = (a) => a - 2 * Math.PI * Math.round(a / (2 * Math.PI));
  for (let i = 1; i < n; i++) ang[i][0] = ang[i - 1][0] + wrap(ang[i][0] - ang[i - 1][0]);
  const loopYaw = ang[n - 1][0] + wrap(ang[0][0] - ang[n - 1][0]) - ang[0][0];
  const starts = []; let acc = 0; for (const k of TOUR_KEYS) { starts.push(acc); acc += k.dur; }
  return { n, eyes, ang, loopYaw, starts, total: acc };
})();
function catmull(p0, p1, p2, p3, t) {
  const t2 = t * t, t3 = t2 * t;
  return 0.5 * (2 * p1 + (-p0 + p2) * t + (2 * p0 - 5 * p1 + 4 * p2 - p3) * t2 + (-p0 + 3 * p1 - 3 * p2 + p3) * t3);
}
function tourPose(sec) {
  const K = tourKeysView, T = ((sec % K.total) + K.total) % K.total;
  let i = K.n - 1; while (K.starts[i] > T) i--;
  const t = (T - K.starts[i]) / TOUR_KEYS[i].dur;
  const at = (j) => { const m = ((j % K.n) + K.n) % K.n, lap = Math.floor(j / K.n);
    return { e: K.eyes[m], yaw: K.ang[m][0] + lap * K.loopYaw, pitch: K.ang[m][1] }; };
  const a = at(i - 1), b = at(i), c = at(i + 1), d = at(i + 2);
  const eye = [0, 1, 2].map(x => catmull(a.e[x], b.e[x], c.e[x], d.e[x], t));
  return { eye, yaw: catmull(a.yaw, b.yaw, c.yaw, d.yaw, t), pitch: catmull(a.pitch, b.pitch, c.pitch, d.pitch, t) };
}
function fwdFrom(yaw, pitch) { const cp = Math.cos(pitch); return [-cp * Math.sin(yaw), Math.sin(pitch), cp * Math.cos(yaw)]; }
function placeCamera(eye, f) {
  const D = 0.05; f = norm(f);
  cam.target = [eye[0] + f[0] * D, eye[1] + f[1] * D, eye[2] + f[2] * D];
  cam.dist = D; cam.pitch = Math.asin(Math.max(-1, Math.min(1, f[1]))); cam.yaw = Math.atan2(-f[0], f[2]);
  dirty = true;
}
const STOP_NAMES = ["入口から", "バック棚へ", "カウンター席から", "酒棚に沿って", "ランプを見上げて", "奥から振り返る", "入口へ戻る"];
const SHARE_URL = "https://arai-max.github.io/nekome-3d/";
tour.hold = false; tour.settled = false;
let lastStop = -1;
const $ = (id) => document.getElementById(id);
function canTour() { return !!(shown && VERSIONS[shown].aligned && !flipped); }
function stopIndex() {
  const K = tourKeysView, T = ((tour.time % K.total) + K.total) % K.total;
  let i = K.n - 1; while (K.starts[i] > T) i--; return i;
}
function tourStep(dt) {
  if (!tour.playing || (tour.hold && tour.settled)) return;

  const p = tourPose(tour.time); let eye = p.eye, f = fwdFrom(p.yaw, p.pitch);
  if (tour.blend < 1) {

    eye = eye.map((v, k) => tour.from.eye[k] + (v - tour.from.eye[k]) * w);
    f = f.map((v, k) => tour.from.f[k] + (v - tour.from.f[k]) * w);
  }
  placeCamera(eye, f);
  if (tour.hold && tour.blend >= 1) tour.settled = true;

}
function updateTourUI() {
  const btn = $("tourBtn"), auto = tour.playing && !tour.hold, ok = canTour();
  btn.setAttribute("aria-pressed", String(tour.playing));
  $("tourLbl").textContent = auto ? "ひと休み" : "見て回る";
  btn.setAttribute("aria-label", auto ? "案内をひと休みする" : "お店の中を案内してもらう");
  btn.disabled = !ok; $("prevBtn").disabled = !ok; $("nextBtn").disabled = !ok;
  const i = stopIndex();

  else { $("capStep").textContent = ""; $("capText").textContent = ok ? "自由に見て回れます" : ""; }

}

function ring() { const b = $("tourBtn"); b.classList.remove("ring"); void b.offsetWidth; b.classList.add("ring"); }

let toastTimer = 0, hintTimer = 0;

/* ---------- bundled scan ---------- */
const VERSIONS = {
  orig: { file: "scene_orig.b64.txt", name: "店内3Dスキャン", aligned: true },
};
const cache = {};
let shown = null, firstLoad = true;
async function fetchVersion(key) {
  if (cache[key]) return cache[key];
  const res = await fetch(VERSIONS[key].file);
  if (!res.ok) throw new Error("HTTP " + res.status);
  const total = +res.headers.get("content-length") || 0;
  let buf;
  if (res.body && total) {
    const reader = res.body.getReader(), parts = []; let got = 0;
    for (;;) {
      const { done, value } = await reader.read(); if (done) break;
      parts.push(value); got += value.length;
      showStatus("スキャンデータを読み込み中… " + Math.min(100, Math.round(got / total * 100)) + "%");
    }
    const all = new Uint8Array(got); let o = 0; for (const p of parts) { all.set(p, o); o += p.length; }
    buf = all.buffer;
  } else buf = await res.arrayBuffer();
  showStatus("3Dデータを展開中…");
  await new Promise(r => setTimeout(r, 30));
  const bin = atob(new TextDecoder().decode(buf).trim());
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return (cache[key] = await parseSPZ(bytes.buffer));
}
async function showVersion(key) {
  if (key === shown) return;
  document.getElementById("vOrig").setAttribute("aria-pressed", String(key === "orig"));
  document.getElementById("vPhoto").setAttribute("aria-pressed", String(key === "photo"));
  document.getElementById("vRaw").setAttribute("aria-pressed", String(key === "raw"));
  showStatus("スキャンデータを読み込み中…");
  try {
    const d = await fetchVersion(key);
    const keep = !firstLoad && VERSIONS[key].aligned === VERSIONS[shown].aligned, saved = keep ? { t: cam.target.slice(), yaw: cam.yaw, pitch: cam.pitch, dist: cam.dist } : null;
    useData(d, { name: VERSIONS[key].name, fmt: "SPZ", sample: false, view: "inside", keepView: keep });
    if (saved) { cam.target = saved.t; cam.yaw = saved.yaw; cam.pitch = saved.pitch; cam.dist = saved.dist; syncModeButtons(); dirty = true; }
    const wasFirst = firstLoad;
    shown = key; firstLoad = false;
    if (!VERSIONS[key].aligned) stopTour(); else if (wasFirst && autoTour) startTour(true);
    setTourButton();
    showStatus("");
  } catch (err) {
    console.error(err);
    if (firstLoad) useData(makeSample(), { name: "サンプルの部屋", fmt: "生成データ", sample: true });
    showStatus("スキャンデータを読み込めませんでした。ページを再読み込みしてください。", true);
  }
}
function loadBundled() { showVersion("orig"); }
document.getElementById("vOrig").addEventListener("click", () => showVersion("orig"));
